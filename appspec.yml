# Tells the CodeDeploy agent where to copy the files and which scripts to run.
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/demo-app

file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/install.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/smoke_test.sh
      timeout: 60
      runas: root
